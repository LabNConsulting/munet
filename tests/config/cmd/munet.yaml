version: 1
topology:
  nodes:
    - name: h-shcmd
      cmd: echo foo
      ready-cmd: grep -qx foo "%RUNDIR%/cmd.out"
    - name: h-shcmd-file
      cmd-file: "cmd.sh"
      ready-cmd: grep -qx foo "%RUNDIR%/cmd.out"
    - name: h-pycmd
      cmd: print("foo")
      shell: "/usr/bin/python3"
      ready-cmd: |
        from pathlib import Path
        output = Path("%RUNDIR%/cmd.out").read_text()
        raise SystemExit("foo" not in output.splitlines())
    - name: h-pycmd-file
      cmd-file: "pycmd.py"
      ready-cmd: grep -qx foo "%RUNDIR%/cmd.out"
    - name: h-shcmd-file-noshebang
      cmd-file: "cmd-noshebang.sh"
      ready-cmd: grep -qx foo "%RUNDIR%/cmd.out"
